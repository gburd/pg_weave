name: CI

# pg_weave had NO CI at all until 2026-09-08.  Every gate ran only when a human
# typed it, which is how the entire property-test and fuzz suite sat unnoticed and
# unrun for six days while the FOR codec was modified twice, and how a
# wrong-answer phrase bug shipped as the default.
#
# THIS FILE IS THE ONE THAT IS ACTUALLY WATCHED.  Codeberg is the canonical remote
# and .forgejo/workflows/ci.yml is its workflow, but the Codeberg runner has never
# been registered, whereas Codeberg push-mirrors to github.com/gburd/pg_weave where
# Actions is enabled.  So this file is the operative gate and the Forgejo one is
# kept in sync against the day a Codeberg runner appears.
#
# It was also broken from the day it was written until 2026-09-10, in three ways
# that are worth naming because each is a way a mirrored workflow rots:
#
#   1. The `test` job carried `runs-on: docker` and a `container:` image copied
#      from the Forgejo file.  GitHub has no runner labelled `docker`, so those
#      jobs sat QUEUED -- not failed, queued -- for 21+ hours across four pushes.
#      A queued job is worse than a failing one: nothing goes red.
#   2. The `sanitize` job interpolated ${{ matrix.pg }} while having no matrix, so
#      it built with PG_CONFIG=/usr/lib/postgresql//bin/pg_config and died on
#      "No such file or directory".
#   3. Its steps mixed the container idiom (root, `su postgres`) with the hosted
#      idiom (unprivileged `runner`, `sudo`).
#
# The lesson, and the reason this comment is long: a mirrored workflow shares text
# with its origin but not its runtime, and the differences are exactly the lines
# that decide whether anything runs at all.  When editing either file, diff both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Four pushes each queued a full matrix and none of them ever started.  Superseded
# runs on the same ref are now cancelled so the queue cannot silently deepen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job installs PostgreSQL from PGDG rather than using the runner's
  # preinstalled major, because pg_weave gates on 17 AND 18 and the hosted image
  # tracks neither reliably.
  DEBIAN_FRONTEND: noninteractive

jobs:
  # -------------------------------------------------------------------------
  # Standalone gates.  Deliberately FIRST and independent of PostgreSQL: they
  # test the algorithmic cores, they are the only layer that can catch a codec or
  # a channel bound that is subtly wrong, and they run in a couple of minutes.
  # A fixed-expected-output regression test cannot catch those at all -- the
  # answers stay plausible and are merely wrong.  See doc/TESTING.md.
  # -------------------------------------------------------------------------
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang make
          # The sanitizer runtimes are split out of Ubuntu's clang package, and
          # check-fuzz fails at LINK time without them ("cannot find
          # libclang_rt.asan-x86_64.a").  The unversioned name does not exist on
          # every release, so fall back to the versioned one derived from clang
          # itself rather than hardcoding a number that will age.
          sudo apt-get install -y libclang-rt-dev || \
            sudo apt-get install -y \
              "libclang-rt-$(clang --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -1)-dev"

      - name: Lint gates
        run: |
          make check-ascii    # non-ASCII in install SQL breaks CREATE EXTENSION on LATIN1
          make check-alloc    # the unguarded corpus-scale palloc class behind 4 real crashes
          make check-rename   # pg_fts-era identifiers surviving the fork

      - name: Standalone property tests
        run: make check-standalone

      - name: Fuzz / corruption harness (ASan + UBSan, with planted-bug teeth)
        run: make check-fuzz

  # -------------------------------------------------------------------------
  # Build + regression + isolation + TAP, per PostgreSQL major.
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    env:
      PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
      PGBIN: /usr/lib/postgresql/${{ matrix.pg }}/bin
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg }} from PGDG
        run: |
          # `apt-key` was REMOVED in Ubuntu 24.04, which ubuntu-latest now is, so
          # the key goes in a keyring and the repo line points at it.  The old
          # `apt-key add` form fails outright.
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} \
            gcc make libipc-run-perl
          # The PGDG package USUALLY starts a cluster on install; stop it so it
          # cannot compete for a port or confuse a later initdb.  On the hosted
          # image it often does not create one at all, so "specified cluster
          # '17 main' does not exist" in the log is expected and not a failure.
          sudo pg_ctlcluster ${{ matrix.pg }} main stop 2>/dev/null || true

      - name: Build + install
        run: |
          # with_llvm=no is REQUIRED, not a preference.  PGXS generates LLVM
          # bitcode for JIT inlining during `make install` and that step has
          # aborted inside llvm-lto on these images (core dumped, exit 134) -- a
          # toolchain mismatch, not a defect in pg_weave.  The extension does not
          # need JIT inlining and installs correctly without it.
          make with_llvm=no
          sudo make install with_llvm=no PG_CONFIG="$PG_CONFIG"

      - name: Start a cluster
        # Unlike the Forgejo container job, the hosted runner is an unprivileged
        # user, so initdb runs directly -- no `su postgres`, which would fail here
        # because that account does not own the checkout.
        run: |
          "$PGBIN/initdb" -D /tmp/pgdata --no-locale --encoding=UTF8
          "$PGBIN/pg_ctl" -D /tmp/pgdata -o "-k /tmp -c listen_addresses=localhost" -w start

      - name: Regression + isolation
        # PGXS checks TAP_TESTS with ifdef, so PROVE_TESTS points at a trivial
        # always-pass file to make the TAP stage a no-op here; TAP runs below.
        env:
          PGHOST: /tmp
          # PGUSER is deliberately NOT set.  initdb creates a superuser named after
          # the OS user that ran it -- `runner` on a hosted runner -- and libpq
          # already defaults PGUSER to the OS user, so the default is correct and
          # any explicit value is a chance to be wrong.  This previously read
          # `${{ github.actor }}`, which is the GitHub account that pushed
          # (`gburd`), an identity that does not exist as a database role:
          # `FATAL: role "gburd" does not exist`.
        run: make installcheck PROVE_TESTS=ci/noop.pl

      - name: TAP -- the full suite
        # The Forgejo container job can only run t/003 and t/004, because
        # PostgreSQL::Test needs to manage its own clusters and that container
        # cannot. A hosted runner can, and PGDG's -server-dev package ships the
        # PostgreSQL::Test perl modules, so this leg gates all of t/ -- including
        # t/001 crash recovery, t/002 replication, t/010 the format-v6 upgrade
        # over an index containing data, and t/011 chandesc corruption.
        run: make installcheck REGRESS= ISOLATION=

      - name: Upgrade path -- every released version must reach the current one
        # An extension whose version advances without a working upgrade script
        # cannot be upgraded in place.  This chain has only ever been exercised
        # incidentally by sql/wvec.sql.
        env:
          PGHOST: /tmp
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE upg"
          psql -v ON_ERROR_STOP=1 -d upg \
            -c "CREATE EXTENSION pg_weave VERSION '0.1.0'" \
            -c "ALTER EXTENSION pg_weave UPDATE" \
            -c "SELECT extversion FROM pg_extension WHERE extname='pg_weave'"

      - name: Show diffs and logs on failure
        if: failure()
        run: |
          for f in regression.diffs output_iso/regression.diffs; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done
          for f in tmp_check/log/*.log tmp_check/log/regress_log_*; do
            [ -f "$f" ] && { echo "=== $f ==="; tail -80 "$f"; }
          done
          cat /tmp/pgdata/log/* 2>/dev/null | tail -100 || true

  # -------------------------------------------------------------------------
  # Sanitizers.  A separate leg because it is slow and because the failures it
  # finds are a different class: this project's lineage includes an ASan-found
  # SEGV in the page-recycle path (a concurrent reader holding a pointer into a
  # page vacuum had freed and reused).
  # -------------------------------------------------------------------------
  sanitize:
    runs-on: ubuntu-latest
    env:
      # Pinned to 17 on purpose.  This job previously interpolated a matrix
      # variable it did not have and built against an empty path; a literal is
      # correct here precisely because there is no matrix.
      PG_CONFIG: /usr/lib/postgresql/17/bin/pg_config
      PGBIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 from PGDG
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-17 postgresql-server-dev-17 clang make libipc-run-perl
          sudo pg_ctlcluster 17 main stop 2>/dev/null || true

      - name: Build with ASan + UBSan
        # PG_LDFLAGS="-shared-libasan" is load-bearing, and its absence is why
        # this leg's regression stage failed the first time it ever ran.  PGXS
        # does put COPT on the link line as well as in CFLAGS, so -fsanitize is
        # there -- but for a *shared library* clang links only the static
        # interceptor stub by default and leaves the runtime proper undefined,
        # expecting the executable to supply it.  Measured on the same flags:
        #
        #   without -shared-libasan: 13 undefined __asan_* symbols, no DT_NEEDED
        #   with    -shared-libasan: same 13 symbols, DT_NEEDED on the runtime
        #
        # The postmaster is a stock PGDG binary and supplies nothing, so without
        # the flag dlopen() fails with "undefined symbol: __asan_register_elf_globals",
        # CREATE EXTENSION fails, and every later statement in every test file
        # fails too.  The resulting regression.diffs is hundreds of lines of
        # "function weave_check(...) does not exist" cascade with the actual
        # cause off the top of the file.
        run: |
          make CC=clang with_llvm=no \
            COPT="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            PG_LDFLAGS="-shared-libasan"
          sudo make install with_llvm=no PG_CONFIG="$PG_CONFIG"

      - name: Regression under sanitizers
        # halt_on_error is deliberately OFF for UBSan: a report in PostgreSQL
        # itself (not in pg_weave) would otherwise fail the leg.  detect_leaks is
        # off because the backend intentionally leaks into memory contexts it frees
        # wholesale, which is not a defect.
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
          PGHOST: /tmp
          # See the note in the `test` job: PGUSER must not be set here either.
        run: |
          # Once the runtime is a DT_NEEDED of a dlopen'd library rather than of
          # the executable, ASan refuses to initialize -- "ASan runtime does not
          # come first in initial library list" -- and aborts the backend.  The
          # documented remedy is to preload it into the process that will do the
          # dlopen, i.e. the postmaster.  Preloading is correct where
          # verify_asan_link_order=0 is not: that option only silences the check
          # and leaves malloc and free split across two allocators.
          #
          # Resolve the path from the compiler rather than hardcoding a version,
          # and fail here rather than 30 lines of cascade later if it is missing.
          ASAN_RT=$(clang -print-file-name=libclang_rt.asan-x86_64.so)
          if [ ! -f "$ASAN_RT" ]; then
            echo "cannot locate the ASan runtime (clang said: $ASAN_RT)" >&2
            exit 1
          fi
          echo "preloading $ASAN_RT into the postmaster"

          "$PGBIN/initdb" -D /tmp/pgdata --no-locale --encoding=UTF8
          # -l is diagnostics, not decoration: without it the postmaster's stderr
          # goes to this step's stdout, logging_collector is off so /tmp/pgdata/log
          # never exists, and a sanitizer report can be lost to log truncation.
          LD_PRELOAD="$ASAN_RT" \
            "$PGBIN/pg_ctl" -D /tmp/pgdata -l /tmp/postmaster.log \
              -o "-k /tmp -c listen_addresses=localhost" -w start
          make installcheck PROVE_TESTS=ci/noop.pl

      - name: Show diffs and sanitizer output on failure
        if: failure()
        run: |
          # The HEAD of regression.diffs, not the tail.  When CREATE EXTENSION
          # fails, every later statement fails as a consequence and the tail is
          # pure cascade; the first failure is the only one that means anything.
          if [ -f regression.diffs ]; then
            echo "===== regression.diffs (first 200 lines) ====="
            head -200 regression.diffs
          fi
          echo "===== postmaster log (sanitizer reports land here) ====="
          cat /tmp/postmaster.log 2>/dev/null || true
          cat /tmp/pgdata/log/* 2>/dev/null | tail -200 || true
