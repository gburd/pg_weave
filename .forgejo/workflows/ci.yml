name: CI

# pg_weave had NO CI at all until 2026-09-08.  Every gate ran only when a human
# typed it, which is how the entire property-test and fuzz suite sat unnoticed and
# unrun for six days while the FOR codec was modified twice, and how a
# wrong-answer phrase bug shipped as the default.
#
# Codeberg (Forgejo Actions) is the canonical remote's workflow, but as of
# 2026-09-10 THE FORGEJO RUNNER HAS NEVER BEEN REGISTERED, so this file has never
# executed.  Codeberg push-mirrors to github.com/gburd/pg_weave where Actions is
# enabled, so .github/workflows/ci.yml is the gate that is actually watched, and
# this one is kept in sync against the day a runner appears.
#
# The two files share text but not runtime, and that is exactly where a mirrored
# workflow rots: the GitHub copy sat with `runs-on: docker` (a Forgejo label GitHub
# has no runner for) and queued four full matrices for 21+ hours without ever
# starting or turning anything red.  When editing either file, diff both.
# Codeberg runners use `runs-on: docker` with a `container:` image, not GitHub's
# `ubuntu-latest`.  Each matrix leg runs inside the official postgres:<major>
# image, so server and client are present; we add server headers and a toolchain,
# build with PGXS, and run installcheck against a locally started cluster as the
# postgres OS user.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------
  # Standalone gates.  Deliberately FIRST and independent of PostgreSQL: they
  # test the algorithmic cores, they are the only layer that can catch a codec or
  # a channel bound that is subtly wrong, and they run in a couple of minutes.
  # A fixed-expected-output regression test cannot catch those at all -- the
  # answers stay plausible and are merely wrong.  See doc/TESTING.md.
  # -------------------------------------------------------------------------
  standalone:
    runs-on: docker
    container:
      image: debian:bookworm-slim
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc clang make git ca-certificates libc6-dev \
            libclang-rt-dev
          # libclang-rt-dev is REQUIRED, not optional: Debian's clang package does
          # not ship the sanitizer runtimes, so check-fuzz fails at link time with
          # "cannot find libclang_rt.asan-x86_64.a".  Found by running this job in
          # the real container before trusting it -- the workflow would otherwise
          # have failed on its first execution.

      - uses: actions/checkout@v4

      - name: Lint gates
        run: |
          make check-ascii    # non-ASCII in install SQL breaks CREATE EXTENSION on LATIN1
          make check-alloc    # the unguarded corpus-scale palloc class behind 4 real crashes
          make check-rename   # pg_fts-era identifiers surviving the fork

      - name: Standalone property tests
        run: make check-standalone

      - name: Fuzz / corruption harness (ASan + UBSan, with planted-bug teeth)
        run: make check-fuzz

  # -------------------------------------------------------------------------
  # Build + regression + isolation, per PostgreSQL major.
  # -------------------------------------------------------------------------
  test:
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18]
    container:
      image: postgres:${{ matrix.pg }}
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            postgresql-server-dev-${{ matrix.pg }} gcc make git \
            libipc-run-perl ca-certificates

      - uses: actions/checkout@v4

      - name: Build + install
        run: |
          # with_llvm=no is REQUIRED here, not a preference.  PGXS generates LLVM
          # bitcode for JIT inlining during `make install`, and in the postgres:17
          # image that step aborts inside llvm-lto (core dumped, make exits 134) --
          # a toolchain mismatch in the image, not a defect in pg_weave.  The
          # extension does not need JIT inlining, and the .so and SQL install
          # correctly without it.  Found by running this job in the real container
          # before trusting it; CI would otherwise have failed on install while the
          # regression tests that follow passed, which is a confusing way to fail.
          make with_llvm=no PG_CONFIG=/usr/bin/pg_config
          make install with_llvm=no PG_CONFIG=/usr/bin/pg_config

      - name: Regression + isolation
        # initdb refuses to run as root and the postgres image runs CI as root, so
        # the cluster and installcheck go through `su postgres`.  PGXS checks
        # TAP_TESTS with ifdef, so PROVE_TESTS points at a trivial always-pass file
        # to make the TAP stage a no-op here; TAP runs in its own step below.
        run: |
          chown -R postgres:postgres .
          su postgres -c '
            /usr/lib/postgresql/${{ matrix.pg }}/bin/initdb -D /tmp/pgdata --no-locale --encoding=UTF8 &&
            /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_ctl -D /tmp/pgdata \
              -o "-k /tmp -c listen_addresses=localhost" -w start &&
            make installcheck PROVE_TESTS=ci/noop.pl \
              PG_CONFIG=/usr/bin/pg_config PGHOST=/tmp PGUSER=postgres
          '

      - name: TAP -- corruption recovery and server encodings
        # Only t/003 and t/004 run here.  t/001 (crash recovery), t/002
        # (replication), t/005-t/009 need a PostgreSQL::Test cluster-management
        # setup this container job does not provide, so gating them would fail on
        # harness setup rather than on pg_weave.  The Nix flake's tap-pg17/tap-pg18
        # checks run the full nine.
        run: |
          chown -R postgres:postgres .
          su postgres -c '
            make installcheck REGRESS= ISOLATION= \
              PROVE_TESTS="t/003_corruption.pl t/004_encodings.pl" \
              PG_CONFIG=/usr/bin/pg_config
          ' || { echo "=== TAP logs ==="; \
                 cat tmp_check/log/*.log tmp_check/log/regress_log_* 2>/dev/null | tail -120 || true; \
                 exit 1; }

      - name: Upgrade path -- every released version must reach the current one
        # An extension whose version advances without a working upgrade script
        # cannot be upgraded in place.  This project has bumped four times and the
        # chain has only ever been exercised incidentally by sql/wvec.sql.
        run: |
          chown -R postgres:postgres .
          su postgres -c '
            psql -h /tmp -U postgres -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE upg" &&
            psql -h /tmp -U postgres -v ON_ERROR_STOP=1 -d upg \
              -c "CREATE EXTENSION pg_weave VERSION '"'"'0.1.0'"'"'" \
              -c "ALTER EXTENSION pg_weave UPDATE" \
              -c "SELECT extversion FROM pg_extension WHERE extname='"'"'pg_weave'"'"'"
          '

      - name: Show diffs on failure
        if: failure()
        run: |
          for f in regression.diffs output_iso/regression.diffs; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done

  # -------------------------------------------------------------------------
  # Sanitizers.  A separate leg because it is slow and because the failures it
  # finds are a different class: this project's lineage includes an ASan-found
  # SEGV in the page-recycle path (a concurrent reader holding a pointer into a
  # page vacuum had freed and reused).
  # -------------------------------------------------------------------------
  sanitize:
    runs-on: docker
    container:
      image: postgres:17
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            postgresql-server-dev-17 clang make git libipc-run-perl ca-certificates

      - uses: actions/checkout@v4

      - name: Build with ASan + UBSan
        # PG_LDFLAGS="-shared-libasan" is load-bearing; see the long comment on
        # the same step in .github/workflows/ci.yml.  Short version: for a shared
        # library clang leaves the ASan runtime undefined by default, so the
        # postmaster's dlopen() fails and every test cascades from a failed
        # CREATE EXTENSION.
        run: |
          make CC=clang with_llvm=no \
            COPT="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            PG_LDFLAGS="-shared-libasan" \
            PG_CONFIG=/usr/bin/pg_config
          make install with_llvm=no PG_CONFIG=/usr/bin/pg_config

      - name: Regression under sanitizers
        # halt_on_error is deliberately OFF for UBSan here: a report in PostgreSQL
        # itself (not in pg_weave) would otherwise fail the leg.  detect_leaks is
        # off because the backend intentionally leaks into memory contexts it frees
        # wholesale, which is not a defect.
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          # The runtime has to be preloaded into the postmaster, or ASan aborts
          # the backend with "ASan runtime does not come first in initial library
          # list".  Resolve it from the compiler, and fail here rather than in a
          # cascade if it is missing.
          ASAN_RT=$(clang -print-file-name=libclang_rt.asan-x86_64.so)
          if [ ! -f "$ASAN_RT" ]; then
            echo "cannot locate the ASan runtime (clang said: $ASAN_RT)" >&2
            exit 1
          fi
          chown -R postgres:postgres .
          touch /tmp/postmaster.log && chown postgres:postgres /tmp/postmaster.log
          su postgres -c '
            /usr/lib/postgresql/17/bin/initdb -D /tmp/pgdata --no-locale --encoding=UTF8 &&
            LD_PRELOAD='"$ASAN_RT"' /usr/lib/postgresql/17/bin/pg_ctl -D /tmp/pgdata \
              -l /tmp/postmaster.log \
              -o "-k /tmp -c listen_addresses=localhost" -w start &&
            make installcheck PROVE_TESTS=ci/noop.pl \
              PG_CONFIG=/usr/bin/pg_config PGHOST=/tmp PGUSER=postgres
          '

      - name: Show diffs and sanitizer output on failure
        if: failure()
        run: |
          # The HEAD of regression.diffs, not the tail: when CREATE EXTENSION
          # fails, the tail is pure cascade and the first failure is the only
          # one that means anything.
          if [ -f regression.diffs ]; then
            echo "===== regression.diffs (first 200 lines) ====="
            head -200 regression.diffs
          fi
          echo "===== postmaster log (sanitizer reports land here) ====="
          cat /tmp/postmaster.log 2>/dev/null || true
          cat /tmp/pgdata/log/* 2>/dev/null | tail -200 || true
